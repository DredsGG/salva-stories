name: Test

# O teste do Pix roda sem navegador. Os testes de ponta a ponta (Chromium, Instagram e CDN simulados) rodam no PC: veja tests/README.md.
on:
  push:
  workflow_dispatch:

jobs:
  pix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pix code (Support button)
        run: node tests/teste-pix.mjs extension
